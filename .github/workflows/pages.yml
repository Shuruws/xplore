name: Deploy xplore to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - 'content/projects.json'
      - 'scripts/build.mjs'
      - 'scripts/check.mjs'
      - 'package.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build site
        run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
      - name: Check content and RSS
        run: npm run check
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
